  :root {
    --ink: #24141d;
    --ink-2: #4b3a44;
    --muted: #76636e;
    --line: #eadbe2;
    --paper: #ffffff;
    --plum: #741b47;
    --plum-d: #4f0f2f;
    --plum-t: #fbe6f0;
    --teal: #134f5c;
    --teal-t: #ddf0f1;
    --coral: #f2553f;
    --coral-t: #ffe6e0;
    --saffron: #ffb000;
    --saffron-d: #8a5a00;
    --saffron-t: #fff2d1;
    --sky: #0a76a6;
    --sky-t: #dcf2fc;
    --mint: #1fbf8f;
    --mint-t: #dbf6ec;
    --good: #12805a;
    --good-t: #def6ea;
    --bad: #c42f48;
    --bad-t: #ffe4e8;
    --head: "Bricolage Grotesque", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --sans: "Manrope", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --r: 22px;
    --shadow: 0 1px 2px rgba(60,20,40,.06), 0 12px 32px -14px rgba(90,20,55,.28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans); font-size: 16px; line-height: 1.6; color: var(--ink);
    background-color: #fff6ec;
    background-image:
      radial-gradient(42rem 30rem at -8% -4%, rgba(10,118,166,.30), transparent 62%),
      radial-gradient(40rem 28rem at 108% 0%, rgba(255,176,0,.42), transparent 60%),
      radial-gradient(44rem 30rem at 106% 96%, rgba(31,191,143,.30), transparent 62%),
      radial-gradient(44rem 30rem at -6% 100%, rgba(242,85,63,.30), transparent 60%),
      radial-gradient(34rem 24rem at 50% 46%, rgba(116,27,71,.10), transparent 70%);
    min-height: 100vh; overflow-x: hidden; position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .32; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .15  0 0 0 0 .2  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 24px 20px 36px; }
  h1, h2, h3 { font-family: var(--head); margin: 0; line-height: 1.12; letter-spacing: -.015em; font-weight: 700; }
  p { margin: 0; }
  .i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .eyebrow, .lab, .band small, .deck-list small, .chg b, .rc .rb, .opt .tag, .rail .where span { word-spacing: .18em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 10px; }
  [tabindex="-1"]:focus { outline: none; }

  /* Header */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .uni b { display: block; font-family: var(--head); font-size: 21px; letter-spacing: -.01em; color: var(--plum-d); }
  .uni span { font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .chip-pa { display: inline-flex; align-items: center; gap: 8px; background: var(--teal); color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .03em; padding: 8px 14px 8px 10px; border-radius: 999px; box-shadow: 0 6px 16px -8px rgba(19,79,92,.7); }
  .chip-pa .dot { width: 18px; height: 18px; border-radius: 6px; background: var(--saffron); display: grid; place-items: center; color: var(--ink); }
  .chip-pa .dot .i { width: 12px; height: 12px; stroke-width: 2.6; }

  /* Deck rail */
  .rail { display: flex; align-items: center; justify-content: space-between; gap: 14px; background: rgba(255,255,255,.86); backdrop-filter: blur(6px); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 16px; margin-bottom: 18px; }
  .rail .where b { display: block; font-family: var(--head); font-size: 17px; }
  .rail .where span { font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .pips { display: flex; gap: 8px; list-style: none; margin: 0; padding: 0; }
  .pip { position: relative; width: 40px; height: 52px; border-radius: 9px; border: 2px dashed #d9c6d0; background: #fff; display: grid; place-items: center; color: #b49cab; transition: transform .2s ease; }
  .pip .i { width: 18px; height: 18px; }
  .pip.cur { border: 2px solid transparent; background: var(--tc); color: var(--bt); transform: translateY(-3px) rotate(-3deg); box-shadow: 0 10px 18px -10px rgba(60,10,40,.6); }
  .pip.ok { border: 2px solid var(--good); background: var(--good-t); color: var(--good); }
  .pip.no { border: 2px solid var(--bad); background: var(--bad-t); color: var(--bad); }
  .pip .mk { position: absolute; right: -6px; top: -6px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
  .pip.ok .mk { background: var(--good); }
  .pip.no .mk { background: var(--bad); }
  .pip .mk .i { width: 11px; height: 11px; stroke-width: 3; }

  /* Type palette */
  .t-scale { --tc: var(--plum); --bt: #fff; --tt: var(--plum-t); --tx: var(--plum); }
  .t-spec { --tc: var(--coral); --bt: #2a0d10; --tt: var(--coral-t); --tx: #b8321f; }
  .t-market { --tc: var(--teal); --bt: #fff; --tt: var(--teal-t); --tx: var(--teal); }
  .t-local { --tc: var(--sky); --bt: #fff; --tt: var(--sky-t); --tx: var(--sky); }
  .t-sme { --tc: var(--saffron); --bt: #2b1c00; --tt: var(--saffron-t); --tx: var(--saffron-d); }

  .card { background: var(--paper); border-radius: var(--r); box-shadow: var(--shadow); }
  .grain { position: relative; isolation: isolate; overflow: hidden; }
  .grain::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .38; mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"); }

  /* Intro */
  .hero { border-radius: 28px; color: #fff; padding: 40px 38px; display: grid; grid-template-columns: minmax(0,1.25fr) minmax(0,.75fr); gap: 24px; align-items: center;
    background: radial-gradient(26rem 18rem at 92% 10%, rgba(255,176,0,.75), transparent 62%), radial-gradient(24rem 18rem at 4% 110%, rgba(10,118,166,.7), transparent 60%), linear-gradient(130deg, #4f0f2f 0%, #741b47 42%, #b4314f 74%, #f2553f 100%); box-shadow: 0 24px 50px -26px rgba(79,15,47,.8); }
  .eyebrow { font-size: 12.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  .hero .eyebrow { color: #ffe3a3; }
  .hero h1 { font-size: clamp(34px, 5.2vw, 58px); margin: 12px 0 14px; }
  .hero h1 .sw { background: linear-gradient(transparent 70%, rgba(255,176,0,.9) 70%, rgba(255,176,0,.9) 92%, transparent 92%); padding: 0 2px; }
  .hero p.lead { font-size: 17.5px; max-width: 560px; color: #ffeef4; }
  .fan { position: relative; height: 230px; }
  .fc { position: absolute; top: 18px; left: 50%; width: 140px; height: 190px; margin-left: -70px; border-radius: 16px; background: #fff; color: var(--ink); box-shadow: 0 18px 30px -14px rgba(30,0,15,.55); overflow: hidden; display: flex; flex-direction: column; }
  .fc .fb2 { height: 58px; background: var(--tc); color: var(--bt); display: grid; place-items: center; }
  .fc .fb2 .i { width: 28px; height: 28px; }
  .fc .fl { padding: 12px; font-family: var(--head); font-size: 17px; font-weight: 700; }
  .fc .fl small { display: block; font-family: var(--sans); font-size: 11.5px; color: var(--muted); font-weight: 700; margin-top: 4px; }
  .fc .ln { margin: 0 12px 7px; height: 7px; border-radius: 4px; background: var(--tt); }
  .fc:nth-child(1) { transform: translateX(-74px) rotate(-12deg); }
  .fc:nth-child(2) { transform: translateY(-8px); z-index: 2; }
  .fc:nth-child(3) { transform: translateX(74px) rotate(12deg); }

  .intro-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 18px; margin-top: 18px; }
  .intro-grid .card { padding: 24px; }
  .sect-h { display: flex; align-items: center; gap: 10px; font-family: var(--head); font-size: 20px; margin-bottom: 14px; }
  .sect-h .ib { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--plum-t); color: var(--plum); }
  .how { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .how li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; padding: 12px; border-radius: 14px; background: #fbf5f8; }
  .how .n { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-family: var(--head); font-weight: 800; font-size: 18px; }
  .how li:nth-child(1) .n { background: var(--saffron); color: #2b1c00; }
  .how li:nth-child(2) .n { background: var(--plum); color: #fff; }
  .how li:nth-child(3) .n { background: var(--teal); color: #fff; }
  .how b { display: block; font-family: var(--head); font-size: 16.5px; }
  .how span { font-size: 14.5px; color: var(--ink-2); }
  .deck-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .deck-list li { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: center; padding: 9px 12px 9px 9px; border-radius: 14px; border: 1.5px solid var(--line); }
  .deck-list .ti { width: 38px; height: 38px; border-radius: 10px; background: var(--tc); color: var(--bt); display: grid; place-items: center; }
  .deck-list b { display: block; font-size: 14.5px; line-height: 1.35; }
  .deck-list small { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--tx); }
  .startbar { margin-top: 18px; padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; }
  .meta span { font-size: 13px; font-weight: 700; color: var(--ink-2); background: #f7eef2; padding: 6px 11px; border-radius: 999px; }

  /* Buttons */
  .btn { appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 13px 22px; border-radius: 999px; background: var(--plum); color: #fff; box-shadow: 0 10px 22px -12px rgba(116,27,71,.9), inset 0 -3px 0 rgba(0,0,0,.18); transition: transform .15s ease, background .15s ease; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); background: var(--plum-d); }
  .btn:disabled { opacity: .42; cursor: not-allowed; box-shadow: none; }

        '<div class="tally"><b>' + total + '<span style="font-size:26px;color:#c5f2e6">/' + N + '</span></b><span>decisions fit the context</span></div>' +
      '</section>' +
      '<section class="card areas" aria-labelledby="ah"><h2 class="sect-h" id="ah"><span class="ib">' + ic("lens") + '</span>Performance by area</h2>' + rows + '</section>' +
      '<section class="recap" aria-labelledby="rh"><h2 id="rh">Your six cards</h2><div class="rgrid">' + cards + '</div></section>' +
      '<div class="card endbar"><p>Want another run? Try Again starts the deck from the first card.</p><button class="btn ghost" id="again" type="button">' + ic("restart") + 'Try Again</button></div>';
    document.getElementById("again").addEventListener("click", function () { S.res = []; go(0); });
  }

  function go(v) {
    S.view = v; S.sel = -1; S.locked = false;
    renderRail();
    if (v === 0) renderIntro(); else if (v > N) renderFinal(); else renderRound();
    window.scrollTo(0, 0);
    var h = app.querySelector("h1[tabindex], h2[tabindex]");
    if (h) h.focus({ preventScroll: true });
    if (v >= 1 && v <= N) say("Card " + v + " of " + N + ": " + ROUNDS[v - 1].title);
    else if (v > N) say("Business Context Assessment. " + okCount() + " of " + N + " decisions fit the context.");
  }

  go(0);
})();
</script>
</body>
</html>
